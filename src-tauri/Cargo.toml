[package]
name = "atelier-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
# custom-protocol: devUrl 대신 tauri:// 커스텀 프로토콜로 내장 에셋을 서빙.
# 이게 없으면 release 빌드에서도 localhost:5173(devUrl)을 찾으러 가서
# "Could not connect to localhost"가 뜬다.
tauri = { version = "2", features = ["custom-protocol"] }
# 롤링 릴리즈: GitHub Releases 기반 자동 업데이트
tauri-plugin-updater = "2"
# 업데이트 설치 후 앱 재시작 (프론트 relaunch)
tauri-plugin-process = "2"
# tauri::generate_context!() 매크로가 직접 의존성으로 요구
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
codegen-units = 1
