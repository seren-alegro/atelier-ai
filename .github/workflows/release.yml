name: Release

# 태그 푸시(v*) → 전체 플랫폼 빌드 → draft 릴리즈 → 검증 → 공개.
# 수동 실행(workflow_dispatch)은 빌드까지만 하고 릴리즈는 만들지 않는다
# (패키징 변경 스모크 테스트용).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 버전 일치 확인
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            V=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
            [ "$V" = "$TAG" ] || { echo "tauri.conf.json 버전($V)이 태그($TAG)와 달라요"; exit 1; }
            V=$(grep '^version' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
            [ "$V" = "$TAG" ] || { echo "Cargo.toml 버전($V)이 태그($TAG)와 달라요"; exit 1; }
            V=$(python3 -c "import json; print(json.load(open('frontend/package.json'))['version'])")
            [ "$V" = "$TAG" ] || { echo "package.json 버전($V)이 태그($TAG)와 달라요"; exit 1; }
            echo "버전 OK: $TAG"
          else
            echo "수동 실행: 버전 검사를 건너뜁니다."
          fi

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux/Windows는 CUDA torch 포함 (NVIDIA GPU용).
          # macOS는 CPU torch (MPS는 CPU 빌드로 동작).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            torch_index: https://download.pytorch.org/whl/cu128
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            torch_index: https://download.pytorch.org/whl/cu128
          - os: macos-latest
            target: aarch64-apple-darwin
            torch_index: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Rust 툴체인
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python 설치 (백엔드 동결용)
        run: uv python install 3.12

      - name: Linux 시스템 의존성
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file \
            libssl-dev libgtk-3-dev

      - name: 프론트엔드 빌드
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 백엔드 동결 (PyInstaller)
        shell: bash
        env:
          TORCH_INDEX_URL: ${{ matrix.torch_index }}
        run: ./scripts/freeze-backend.sh

      - name: Tauri 빌드 (업데이터 서명 포함)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd frontend
          npx @tauri-apps/cli@2 build --target ${{ matrix.target }}

      - name: 번들 업로드
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
          retention-days: 7

  publish:
    # 태그 푸시일 때만 릴리즈 발행. 수동 실행은 빌드 검증용.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: bundles
          merge-multiple: true

      - name: latest.json 생성
        env:
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/make-latest-json.py bundles "${GITHUB_REF_NAME}"

      - name: 릴리즈 생성 (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mapfile -t FILES < <(find bundles latest.json -type f | sort)
          echo "업로드 파일:"; printf '  %s\n' "${FILES[@]}"
          gh release create "$TAG" --draft \
            --title "Atelier AI $TAG" \
            --notes "자동 빌드 릴리즈입니다. 앱에서 자동 업데이트됩니다." \
            "${FILES[@]}"

      - name: latest.json 검증 후 공개
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q '^latest.json$'
          echo "latest.json 확인됨. 릴리즈를 공개합니다."
          gh release edit "$TAG" --draft=false
