[project]
name = "atelier-ai-backend"
version = "0.1.0"
description = "Atelier AI backend - local image generation engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.18",  # PNG 메타 읽기(/api/png-info) multipart 업로드용
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    # 생성 엔진 (무거움: uv sync 시 수 GB 다운로드. CUDA 사용자는
    # torch를 https://pytorch.org 안내에 따라 별도 설치 권장)
    "diffusers>=0.30",
    "torch>=2.2",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy>=1.26",
    # 포즈 자동 추출 (DWPose ONNX, CPU 실행)
    "onnxruntime>=1.17",
    # 얼굴 검출 (ADetailer face_yolov8n, ultralytics YOLO)
    "ultralytics>=8.3",
    # LoRA 학습 (diffusers + peft 직접 구현)
    "peft>=0.12",
    "transformers>=4.44",  # BLIP 자동 캡션용 (diffusers가 이미 요구)
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = true
